<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>账户与管理 · Telysta</title><link rel="stylesheet" href="./style.css"><script src="./app.js" type="module"></script></head>
<body><header class="site-header"><a href="/">Weiser's Melancholy</a><a href="/ebooks/">返回书室</a></header>
<main><section id="login" hidden><p class="eyebrow">TELYSTA CONSOLE</p><h1>登录或注册</h1><p class="muted">使用邮箱验证码进入。首次登录会建立普通用户账号。</p><form id="login-form"><label for="email">邮箱</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required><div class="code-row"><div><label for="code">六位验证码</label><input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></div><button id="send-code" type="button">获取验证码</button></div><button type="submit" class="primary">登录</button></form><p role="status" id="login-status" aria-live="polite"></p></section>
<section id="account" hidden><div class="account-head"><div><p class="eyebrow">TELYSTA CONSOLE</p><h1>账户与管理</h1><p id="identity" class="muted"></p></div><button id="logout" type="button">退出登录</button></div><nav id="navigation" aria-label="账户功能"></nav><p id="notice" role="status" aria-live="polite"></p><section id="workspace" aria-label="当前管理功能"></section></section>
<p id="loading" role="status">正在读取账户…</p></main></body></html>
