<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <meta name="theme-color" content="#070a10">
 <meta name="robots" content="noindex,nofollow">
 <title>账户空间 · Telysta</title>
 <link rel="preload" href="./cinzel.woff2" as="font" type="font/woff2" crossorigin>
 <link rel="stylesheet" href="./style.css">
 <link rel="stylesheet" href="./app.css">
 <script src="./app.js" type="module"></script>
</head>
<body>
 <div id="account-starfield" class="starfield" aria-hidden="true"><canvas class="starfield__canvas"></canvas></div>
 <a class="skip-link" href="#main">跳至主要内容</a>
 <header class="site-header">
  <a class="site-header__brand" href="/" translate="no">Weiser’s Melancholy</a>
 </header>
 <main id="main">
  <section id="login" class="login-panel" aria-labelledby="login-title" hidden>
   <div class="login-heading">
    <h1 id="login-title">登录</h1>
    <button id="auth-language" class="text-button" type="button" lang="en">English</button>
   </div>
   <form id="login-form" method="post" action="./api/auth/login">
    <div id="identifier-field" class="field">
     <label for="identifier">用户名或邮箱</label>
     <input id="identifier" name="identifier" autocomplete="username" spellcheck="false" autocapitalize="none" maxlength="254" required aria-describedby="identifier-error">
     <span id="identifier-error" class="field-error"></span>
    </div>
    <div id="username-field" class="field" hidden>
     <label for="username">用户名</label>
     <input id="username" name="username" autocomplete="username" spellcheck="false" autocapitalize="none" minlength="3" maxlength="24" aria-describedby="username-help username-status username-error" disabled>
     <span id="username-help" class="field-help">以字母开头，3–24位字母、数字、下划线或短横线。</span>
     <span id="username-status" class="field-help" role="status"></span>
     <span id="username-error" class="field-error"></span>
    </div>
    <div id="email-field" class="field" hidden>
     <label for="email">邮箱</label>
     <div class="email-field">
      <input id="email" name="email" type="email" autocomplete="email" spellcheck="false" autocapitalize="none" maxlength="254" placeholder="you@example.com" aria-describedby="email-error" disabled>
      <button id="send-code" type="button">获取验证码</button>
     </div>
     <span id="email-error" class="field-error"></span>
    </div>
    <div id="password-field" class="field">
     <label for="password">密码</label>
     <div class="password-field">
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="512" required aria-describedby="password-help password-error">
      <button id="password-toggle" type="button" aria-pressed="false" aria-label="显示密码"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
     </div>
     <span id="password-help" class="field-help" hidden>至少15个字符，可使用空格与中文。</span>
     <span id="password-error" class="field-error"></span>
    </div>
    <div id="code-field" class="field" hidden>
     <div class="field-caption"><label for="code">六位验证码</label><span id="code-expiry">5 分钟内有效</span></div>
     <input id="code" name="code" class="code-input" inputmode="numeric" autocomplete="one-time-code" spellcheck="false" pattern="[0-9]{6}" maxlength="6" placeholder="000000" aria-describedby="code-expiry code-error" disabled>
     <span id="code-error" class="field-error"></span>
    </div>
    <button id="sign-in" type="submit" class="primary login-submit">登录</button>
   </form>
   <p role="status" id="login-status" aria-live="polite"></p>
   <nav id="auth-modes" class="login-footnote" aria-label="账户入口"></nav>
  </section>
  <section id="account" class="console-shell" aria-label="账户管理" hidden>
   <aside id="console-sidebar" class="console-sidebar">
    <div class="sidebar-heading"><a href="/" class="site-header__brand" translate="no">Weiser’s Melancholy</a><button id="menu-close" type="button" class="icon-button"></button></div>
    <nav id="navigation" aria-label="账户功能"></nav>
    <div class="sidebar-account"><p id="identity" class="muted"></p><button id="logout" type="button" class="text-button">退出登录</button></div>
   </aside>
   <div class="console-main">
    <header class="console-bar"><button id="menu-trigger" type="button" class="icon-button" aria-controls="mobile-menu" aria-expanded="false"></button><span id="current-task"></span><button id="console-language" type="button" class="text-button">English</button></header>
    <div class="console-scroll"><p id="notice" role="status" aria-live="polite" hidden></p><section id="workspace" tabindex="-1" aria-label="当前管理功能"></section></div>
   </div>
  </section>
  <dialog id="mobile-menu" class="mobile-menu" aria-label="账户导航"></dialog>
  <p id="loading" class="loading-state" role="status">正在读取账户…</p>
  <noscript><p class="loading-state">账户登录需要 JavaScript。请启用后刷新，或<a href="/">返回网站</a>。</p></noscript>
 </main>
</body>
</html>
